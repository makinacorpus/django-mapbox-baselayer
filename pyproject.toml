[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-mapbox-baselayer"
dynamic = ["version", "readme"]
description = "Django model to store and serve mapbox base layer config"
authors = [
    {name = "Makina Corpus", email = "geobi@makina-corpus.com"},
]
# readme will be dynamic to allow concatenating files
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Framework :: Django",
]
dependencies = [
    "django>=4.2",
    "requests",
    "pmtiles",
    "tqdm",
    "mercantile",
    "certifi"
]

[project.urls]
Homepage = "https://github.com/makinacorpus/django-mapbox-baselayer.git"

[project.optional-dependencies]
dev = [
    "factory-boy",
    "ruff",
    "coverage[toml]",
    "django-debug-toolbar",
]

[tool.setuptools.dynamic]
version = {file = "mapbox_baselayer/VERSION.md"}
readme = {file = ["README.md", "CHANGES.md"], content-type = "text/markdown"}

[tool.setuptools]
packages = { find = { include = ["mapbox_baselayer*"] } }
exclude-package-data = { "*" = ["CHANGES.md", "README.md"] }
include-package-data = true

[tool.setuptools.package-data]
mapbox_baselayer = ["locale/**/*.po", "locale/**/*.mo", "static/**/*"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "**/settings/demo*",
    "**/settings/e2e*"
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.9
target-version = "py39"

[tool.ruff.lint]
select = ["G", "INT", "E4", "E7", "E9", "F", "DJ", "LOG", "UP", "I", "T10", "EM", "T201"]
ignore = ["DJ006"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/lib*",
    "test_mapbox_baselayer/*",
    "doc/*",
    "manage.py"
]

[tool.coverage.report]
ignore_errors = true
